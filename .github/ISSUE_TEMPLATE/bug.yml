name: Bug report
description: Report reproducible incorrect behavior that is not an urgent window-safety issue
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include private window titles, document names, browser URLs, account names, or other identifying content. Redact diagnostics before attaching them.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the behavior without private titles or identifiers.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest safe sequence of actions and whether automatic mode was enabled.
      placeholder: |
        1. Start Fractile with ...
        2. Open sanitized test windows ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Fractile version or commit
      placeholder: Current version or commit SHA
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac architecture
      placeholder: macOS 14.x, Apple silicon
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Remove private titles, paths, URLs, account names, and stable application/window identifiers. Prefer a minimal test setup.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed private titles, identifiers, paths, URLs, and account information.
          required: true
