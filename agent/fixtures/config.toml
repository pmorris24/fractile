# Fractile configuration.
version = 1

[[rules]]
bundle_id = "anomaly.hex"
action = "float"

[[rules]]
bundle_id = "com.apple.systempreferences"
action = "float"

[[rules]]
# OpenCode Browser's agent window (its pinned placeholder tab sets this title when it opens).
bundle_id = "com.brave.Browser"
title = "OpenCode Browser agents - Brave"
action = "route"
workspace = 9

[[rules]]
bundle_id = "com.brave.Browser"
action = "route"
workspace = 1

[[rules]]
bundle_id = "net.imput.helium"
action = "route"
workspace = 1

[[rules]]
bundle_id = "ai.opencode.desktop"
action = "route"
workspace = 3

[[rules]]
bundle_id = "ai.opencode.desktop.beta"
action = "route"
workspace = 3

[[rules]]
bundle_id = "com.apple.MobileSMS"
action = "route"
workspace = "M"

[[rules]]
bundle_id = "com.tinyspeck.slackmacgap"
action = "route"
workspace = 2

[[rules]]
bundle_id = "com.apple.Notes"
action = "route"
workspace = "5"

[[rules]]
bundle_id = "com.apple.Preview"
action = "route"
workspace = "5"

[[rules]]
bundle_id = "com.apple.mail"
action = "route"
workspace = "5"

[[rules]]
bundle_id = "com.apple.iCal"
action = "route"
workspace = "5"

[[rules]]
bundle_id = "com.apple.Music"
action = "route"
workspace = "5"

[[rules]]
bundle_id = "com.mitchellh.ghostty"
action = "route"
workspace = "5"

[[workspaces]]
workspace = "5"
monitor = "main"


[[workspaces]]
workspace = "M"
monitor = "main"

[[workspaces]]
workspace = 9
monitor = "main"
