[package]
name = "fractile"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
description = "A macOS tiling window manager with stable logical windows"
repository = "https://github.com/pmorris24/fractile"
publish = false
default-run = "fractile"

[build-dependencies]
cc = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ctrlc = { version = "3", features = ["termination"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "block2",
  "libc",
  "objc2-core-foundation",
  "objc2-core-graphics",
  "objc2-quartz-core",
  "NSApplication",
  "NSAttributedString",
  "NSBezierPath",
  "NSButton",
  "NSCell",
  "NSControl",
  "NSColor",
  "NSEvent",
  "NSFont",
  "NSImage",
  "NSMenu",
  "NSMenuItem",
  "NSResponder",
  "NSRunningApplication",
  "NSScreen",
  "NSGraphics",
  "NSStatusBar",
  "NSStatusBarButton",
  "NSStatusItem",
  "NSStringDrawing",
  "NSTextAttachment",
  "NSTouch",
  "NSView",
  "NSWorkspace",
] }
objc2-application-services = { version = "0.3.2", default-features = false, features = [
  "std",
  "libc",
  "HIServices",
  "AXError",
  "AXUIElement",
  "AXValue",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "CFArray",
  "CFDate",
  "CFDictionary",
  "CFFileDescriptor",
  "CFMachPort",
  "CFNumber",
  "CFRunLoop",
  "CFString",
  "CFUUID",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
  "CGEvent",
  "CGEventSource",
  "CGEventTypes",
  "CGGeometry",
  "CGWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "block2",
  "NSArray",
  "NSAttributedString",
  "NSDictionary",
  "NSDate",
  "NSEnumerator",
  "NSGeometry",
  "NSNotification",
  "NSObject",
  "NSObjCRuntime",
  "NSOperation",
  "NSRunLoop",
  "NSSet",
  "NSValue",
  "NSString",
  "NSUserDefaults",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "CADisplayLink",
] }
objc2-service-management = { version = "0.3.2", default-features = false, features = [
  "SMAppService",
  "objc2",
  "objc2-foundation",
  "std",
] }

[workspace]
members = ["agent"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
expect_used = "warn"
let_underscore_must_use = "deny"
todo = "warn"
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"

[lints]
workspace = true

# Rune ships patched copies of these crates in its vendor/ folder and expects every app that
# builds it to apply them: a dependency's [patch] does not reach the workspace that depends on it.
# Keep the rev in step with the rune crates in agent/Cargo.toml.
[patch.crates-io]
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "1de0710548e53bb4aa6ef05cd4ca2c69b8fa8323" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "1de0710548e53bb4aa6ef05cd4ca2c69b8fa8323" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "1de0710548e53bb4aa6ef05cd4ca2c69b8fa8323" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "1de0710548e53bb4aa6ef05cd4ca2c69b8fa8323" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "1de0710548e53bb4aa6ef05cd4ca2c69b8fa8323" }
winit = { git = "https://github.com/anomalyco/rune", rev = "1de0710548e53bb4aa6ef05cd4ca2c69b8fa8323" }
